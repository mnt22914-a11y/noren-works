<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:#0A0F1E;color:#F2F5FA;font-family:"Zen Kaku Gothic New",sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 620px 520px at 56% 30%,rgba(46,70,56,.55),rgba(46,70,56,0) 70%)}
.in{position:absolute;left:80px;right:80px;top:0;bottom:0}
.eyebrow{position:absolute;top:98px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:.32em;color:#C8FF3D}
h1{position:absolute;top:150px;margin:0;font-family:"Shippori Mincho",serif;font-weight:700;font-size:84px;line-height:101px;letter-spacing:.04em}
h1 em{font-style:normal;color:#C8FF3D}
p.body{position:absolute;top:478px;margin:0;font-size:34px;font-weight:500;line-height:63px;color:#CDD4E0;letter-spacing:.02em}
.btn{position:absolute;top:778px;left:-4px;height:102px;padding:0 48px;border-radius:999px;background:#C8FF3D;color:#0A1000;font-weight:700;font-size:34px;display:flex;align-items:center;letter-spacing:.02em}
.note{position:absolute;top:900px;font-size:26px;color:#9AA3B5;letter-spacing:.02em}
.foot{position:absolute;top:1200px;font-size:24px;color:#8D97AE}
.logo{position:absolute;top:1252px;font-family:"Shippori Mincho",serif;font-weight:700;font-style:italic;font-size:36px;letter-spacing:.12em}
.pg{position:absolute;top:1255px;right:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:30px;letter-spacing:.18em;color:#8D97AE}
</style></head><body>
<div class="glow"></div>
<div class="in">
  <div class="eyebrow">FOR YOUR SHOP</div>
  <h1>あなたのお店の<br>ホームページを、<br><em>無料で</em>作ります。</h1>
  <p class="body">お店によく来る質問を<br>3つ教えてください。<br>それに答えるホームページを作って、<br>お送りします。</p>
  <div class="btn">DMで「見本」と送るだけ</div>
  <div class="note">売り込みの連絡はしません。</div>
  <div class="foot">※ナイトベースは架空のお店の制作例です。写真: Unsplash</div>
  <div class="logo">ノレン</div>
  <div class="pg">8 / 8</div>
</div>
</body></html>
